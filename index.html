<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Shorty Sabrina!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-grad: linear-gradient(135deg, #ffc4d1, #F89BA8);
    --cake-a: #C08D79;
    --cake-b: #B27C68;
    --seam: #8F5B48;
    --frost: #FFFDF9;
    --plate: #FFFFFF;
    --plate-shadow: #E7A9B4;
    --text-dark: #580d17;
    --text-light: #9B4451;
    --candle-line: #E9DCD7;
    --face: #3A2A2A;
    --bg-dark: #2a1b38;
  }
  *{ box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-dark);
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
  }
  
  body {
    min-height: 100vh; 
    padding: 24px 12px;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 24px;
  }

  /* Responsive container */
  .frame {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 400 / 300;
    animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  
  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute;
    width: 2.5px; height: 2.5px;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 3s infinite ease-in-out;
  }

  .card {
    position: absolute;
    inset: 0;
    background: white;
    padding: 1.8%;
    border-radius: 12px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  
  .card-inner {
    width: 100%; height: 100%;
    background: var(--pink-grad);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  /* Floating background elements inside the card */
  .floating-elements {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .floater {
    position: absolute;
    bottom: -20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 16px;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-300px) rotate(360deg) scale(1.2); opacity: 0; }
  }

  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }

  /* --- CUTE ANIMATIONS --- */
  .cake-grp {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: cakeSeq 8s ease-in-out infinite;
  }
  .frost-grp {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: frostSeq 8s ease-in-out infinite;
  }
  .candle-grp {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: candleSeq 8s ease-in-out infinite;
  }
  
  /* Blushing cheeks */
  .blush {
    animation: blushPulse 2.5s infinite ease-in-out;
  }
  @keyframes blushPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.2); }
  }

  /* Dancing Sidekicks */
  .sidekick {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .left-sidekick {
    animation: sidekickJump 1.4s ease-in-out infinite;
  }
  .right-sidekick {
    animation: sidekickJump 1.4s ease-in-out infinite 0.7s;
  }
  @keyframes sidekickJump {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    40% { transform: translateY(-12px) scale(0.95, 1.05); }
    50% { transform: translateY(-16px) scale(1, 1); }
    60% { transform: translateY(-12px) scale(1.05, 0.95); }
    80% { transform: translateY(0) scale(1.1, 0.9); }
    90% { transform: translateY(0) scale(1, 1); }
  }

  .flame-outer {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flameShow 8s ease-in-out infinite;
  }
  .flame-inner {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flicker 0.9s ease-in-out infinite;
  }
  .eye {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: blink 5s ease-in-out infinite;
  }
  .mouth-smile { opacity: 1; transition: opacity .15s ease; }
  .mouth-sing, .mouth-sing-tongue { opacity: 0; transition: opacity .15s ease; }
  .brow { opacity: 0; transition: opacity .15s ease; }

  @keyframes cakeSeq {
    0%       { transform: scale(1, 0.03); }
    3%       { transform: scale(1, 0.03); }
    7%       { transform: scale(0.93, 1.22); }
    9.5%     { transform: scale(1.05, 0.88); }
    12%      { transform: scale(0.98, 1.05); }
    14%      { transform: scale(1, 1); }
    80%      { transform: scale(1, 1); }
    80.6%    { transform: scale(1, 0.03); }
    100%     { transform: scale(1, 0.03); }
  }
  @keyframes frostSeq {
    0%, 15%  { opacity: 0; transform: scale(1, 0.05); }
    16%      { opacity: 1; transform: scale(1, 0.05); }
    20%      { transform: scale(0.94, 1.25); }
    22.5%    { transform: scale(1.04, 0.9); }
    25%      { transform: scale(1, 1); opacity: 1; }
    80%      { transform: scale(1, 1); opacity: 1; }
    80.6%    { opacity: 0; transform: scale(1, 0.05); }
    100%     { opacity: 0; transform: scale(1, 0.05); }
  }
  @keyframes candleSeq {
    0%, 24%  { opacity: 0; transform: scale(1, 0.05); }
    25%      { opacity: 1; transform: scale(1, 0.05); }
    28%      { transform: scale(0.9, 1.3); }
    30%      { transform: scale(1.06, 0.9); }
    32%      { transform: scale(1, 1); opacity: 1; }
    80%      { transform: scale(1, 1); opacity: 1; }
    80.6%    { opacity: 0; transform: scale(1, 0.05); }
    100%     { opacity: 0; transform: scale(1, 0.05); }
  }
  @keyframes flameShow {
    0%, 31%  { opacity: 0; transform: scale(0.3); }
    35%      { opacity: 1; transform: scale(1.15); }
    37%      { transform: scale(0.95); }
    39%      { transform: scale(1); }
    79%      { opacity: 1; transform: scale(1); }
    80%      { opacity: 0; transform: scale(0.3); }
    100%     { opacity: 0; transform: scale(0.3); }
  }
  @keyframes flicker {
    0%   { transform: rotate(-3deg) scale(1); }
    50%  { transform: rotate(3deg) scale(1.06); }
    100% { transform: rotate(-3deg) scale(1); }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    92%           { transform: scaleY(0.1); }
    94%           { transform: scaleY(1); }
    96%           { transform: scaleY(0.1); }
    98%           { transform: scaleY(1); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .wish-text {
    font-family: 'Poppins', sans-serif;
  }
  .name-text {
    font-weight: 800;
  }

  /* ---------- PARTY MODE ---------- */
  .card-inner.partying .cake-grp { animation: none; transform: scale(1,1); }
  .card-inner.partying .frost-grp { animation: none; transform: scale(1,1); opacity:1; }
  .card-inner.partying .candle-grp { animation: none; transform: scale(1,1); opacity:1; }
  .card-inner.partying .flame-outer { animation: none; transform: scale(1); opacity:1; }
  .card-inner.partying .flame-inner { animation-duration: 0.28s; }
  .card-inner.partying .mouth-smile { opacity:0; }
  .card-inner.partying .mouth-sing,
  .card-inner.partying .mouth-sing-tongue { opacity:1; }
  .card-inner.partying .brow { opacity:1; }

  #cakeScene { transform-box: fill-box; transform-origin: 50% 100%; }
  .card-inner.partying #cakeScene {
    animation: wiggle 0.45s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    25%      { transform: rotate(3deg) translateY(-4px); }
    50%      { transform: rotate(-3deg) translateY(0); }
    75%      { transform: rotate(4deg) translateY(-4px); }
  }

  .card-inner.partying text.wish-text {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: textBounce 0.4s ease-in-out infinite;
  }
  .card-inner.partying text.name-text { 
    animation: textBounce 0.4s ease-in-out infinite, rainbowText 1.5s linear infinite; 
    animation-delay: 0.12s; 
  }
  
  @keyframes textBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-5px) scale(1.06); }
  }
  @keyframes rainbowText {
    0% { fill: #6C111D; }
    33% { fill: #7f1b73; }
    66% { fill: #b82b4a; }
    100% { fill: #6C111D; }
  }

  /* --- CUTE SURPRISE BUTTON --- */
  .surprise-btn {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #2a1230;
    background: linear-gradient(90deg, #ffd27a, #ff8fab);
    border: none;
    padding: 16px 36px;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 140, 171, 0.4);
    transition: transform .15s ease, box-shadow .15s ease;
    animation: btnPulse 2s infinite;
    z-index: 100;
  }
  @keyframes btnPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 140, 171, 0.4); }
    50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(255, 140, 171, 0.6); }
  }
  .surprise-btn:active { 
    transform: scale(0.95); 
    animation: none; 
    box-shadow: 0 5px 15px rgba(255, 140, 171, 0.3);
  }
  .surprise-btn:disabled { 
    opacity: 0.8; 
    cursor: default; 
    animation: none;
    transform: none; 
  }

  /* Confetti & Balloons */
  .confetti-piece {
    position: absolute;
    top: -20px;
    width: 10px; height: 18px;
    border-radius: 3px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }
  
  .balloon-piece {
    position: absolute;
    bottom: -150px;
    width: 48px; height: 62px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation-name: balloonRise;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .balloon-piece::after {
    content: '';
    position: absolute;
    left: 50%; top: 100%;
    width: 2px; height: 50px;
    background: rgba(255,255,255,0.6);
    transform: translateX(-50%);
  }
  @keyframes balloonRise {
    0%   { transform: translateY(0) translateX(0) rotate(-4deg); }
    50%  { transform: translateY(-58vh) translateX(25px) rotate(4deg); }
    100% { transform: translateY(-120vh) translateX(-15px) rotate(-4deg); }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="stars" id="stars"></div>
  <div class="card">
    <div class="card-inner" id="cardInner">
      
      <!-- Floating Hearts Background -->
      <div class="floating-elements" id="floating-elements"></div>

      <!-- viewBox controls responsiveness -->
      <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated birthday cake for Shorty Sabrina">
        <defs>
          <linearGradient id="cakeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="var(--cake-a)"/>
            <stop offset="30%"  stop-color="var(--cake-a)"/>
            <stop offset="31.5%" stop-color="var(--seam)"/>
            <stop offset="33%"  stop-color="var(--cake-b)"/>
            <stop offset="63%"  stop-color="var(--cake-b)"/>
            <stop offset="64.5%" stop-color="var(--seam)"/>
            <stop offset="66%"  stop-color="var(--cake-a)"/>
            <stop offset="100%" stop-color="var(--cake-a)"/>
          </linearGradient>
          <radialGradient id="flameGrad" cx="50%" cy="70%" r="65%">
            <stop offset="0%"  stop-color="#FFF6C6"/>
            <stop offset="45%" stop-color="#FFC24D"/>
            <stop offset="100%" stop-color="#FF7A3D"/>
          </radialGradient>
        </defs>

        <!-- WIDER PLATE FOR SIDEKICKS -->
        <rect x="55" y="182" width="290" height="6" rx="3" fill="var(--plate-shadow)"/>
        <rect x="55" y="178" width="290" height="6" rx="3" fill="var(--plate)"/>

        <!-- LEFT SIDEKICK (Dancing Cupcake) -->
        <g class="sidekick left-sidekick">
          <!-- Wrapper base -->
          <path d="M 70 178 L 75 158 L 95 158 L 100 178 Z" fill="#D49A89"/>
          <!-- Frosting top -->
          <path d="M 68 160 C 68 143, 102 143, 102 160 C 102 166, 68 166, 68 160 Z" fill="#FFB3C6"/>
          <!-- Cute face -->
          <circle cx="80" cy="156" r="1.5" fill="#3A2A2A"/>
          <circle cx="90" cy="156" r="1.5" fill="#3A2A2A"/>
          <path d="M 83 160 Q 85 163 87 160" stroke="#3A2A2A" fill="none"/>
          <!-- Cute arms cheering -->
          <path d="M 75 166 Q 65 163 70 153" stroke="#3A2A2A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M 95 166 Q 105 163 100 153" stroke="#3A2A2A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- RIGHT SIDEKICK (Dancing Cupcake) -->
        <g class="sidekick right-sidekick">
          <path d="M 300 178 L 305 158 L 325 158 L 330 178 Z" fill="#D49A89"/>
          <path d="M 298 160 C 298 143, 332 143, 332 160 C 332 166, 298 166, 298 160 Z" fill="#FFEBB3"/>
          <circle cx="310" cy="156" r="1.5" fill="#3A2A2A"/>
          <circle cx="320" cy="156" r="1.5" fill="#3A2A2A"/>
          <path d="M 313 160 Q 315 163 317 160" stroke="#3A2A2A" fill="none"/>
          <path d="M 305 166 Q 295 163 300 153" stroke="#3A2A2A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M 325 166 Q 335 163 330 153" stroke="#3A2A2A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>

        <g id="cakeScene">
          <!-- MAIN CAKE -->
          <g class="cake-grp">
            <rect x="125" y="112" width="150" height="68" rx="5" fill="url(#cakeGrad)"/>

            <!-- Brows -->
            <path class="brow" d="M155,148 Q166,140 179,146" stroke="var(--face)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path class="brow" d="M221,146 Q234,140 245,148" stroke="var(--face)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

            <!-- Blushing Cheeks -->
            <circle cx="153" cy="165" r="7" fill="#ff7da9" class="blush" />
            <circle cx="247" cy="165" r="7" fill="#ff7da9" class="blush" />

            <!-- Eyes -->
            <g class="eye">
              <circle cx="167" cy="160" r="7.5" fill="white"/>
              <circle cx="168" cy="161" r="3.5" fill="var(--face)"/>
              <circle cx="165" cy="158" r="1.5" fill="white"/> <!-- Eye Sparkle -->
            </g>
            <g class="eye">
              <circle cx="233" cy="160" r="7.5" fill="white"/>
              <circle cx="234" cy="161" r="3.5" fill="var(--face)"/>
              <circle cx="231" cy="158" r="1.5" fill="white"/> <!-- Eye Sparkle -->
            </g>

            <!-- Mouths -->
            <path class="mouth-smile" d="M183,170 Q200,178 217,170" stroke="var(--face)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse class="mouth-sing" cx="200" cy="172" rx="9" ry="7" fill="var(--face)"/>
            <ellipse class="mouth-sing-tongue" cx="200" cy="176" rx="6" ry="3" fill="#ff5e7e"/>
          </g>

          <!-- FROSTING & SPRINKLES -->
          <g class="frost-grp">
            <rect x="125" y="100" width="150" height="14" rx="7" fill="var(--frost)"/>
            <path fill="var(--frost)" d="
              M130,110 C128,110 127,114 129,116 C132,121 134,126 137,126 C140,126 141,120 140,116 C139,113 138,110 137,110 Z
              M153,110 C150,110 148,116 151,122 C155,132 158,140 162,140 C166,140 167,130 165,123 C163,117 161,110 159,110 Z
              M177,110 C174,110 172,115 174,119 C177,125 179,128 182,128 C185,128 186,122 185,118 C184,114 182,110 180,110 Z
              M201,110 C198,110 196,117 199,125 C203,136 206,144 210,144 C214,144 215,133 213,125 C211,118 209,110 207,110 Z
              M225,110 C222,110 220,114 222,118 C225,123 227,126 230,126 C233,126 234,120 233,116 C232,113 230,110 228,110 Z
              M249,110 C246,110 244,116 247,122 C251,131 254,138 258,138 C262,138 263,128 261,122 C259,116 257,110 255,110 Z
            "/>
            <!-- Cute Sprinkles -->
            <rect x="145" y="105" width="5" height="2.5" rx="1" fill="#FF8FAB" transform="rotate(15 145 105)"/>
            <rect x="165" y="112" width="5" height="2.5" rx="1" fill="#8FF0D6" transform="rotate(-25 165 112)"/>
            <rect x="185" y="102" width="5" height="2.5" rx="1" fill="#C9A7FF" transform="rotate(45 185 102)"/>
            <rect x="205" y="115" width="5" height="2.5" rx="1" fill="#F6C667" transform="rotate(-15 205 115)"/>
            <rect x="230" y="105" width="5" height="2.5" rx="1" fill="#FF8FAB" transform="rotate(30 230 105)"/>
            <rect x="250" y="113" width="5" height="2.5" rx="1" fill="#8FF0D6" transform="rotate(-10 250 113)"/>
          </g>

          <!-- CANDLE -->
          <g class="candle-grp">
            <rect x="196" y="66" width="8" height="36" rx="3" fill="var(--frost)"/>
            <rect x="196" y="78" width="8" height="3.5" fill="#C9A7FF"/>
            <rect x="196" y="89" width="8" height="3.5" fill="#FF8FAB"/>
          </g>

          <g class="flame-outer">
            <g class="flame-inner">
              <path fill="url(#flameGrad)" d="
                M200,65
                C205,60 206,52 200,45
                C194,52 195,60 200,65
                Z
              "/>
            </g>
          </g>
        </g>

        <!-- UPDATED TEXT -->
        <text x="200" y="240" text-anchor="middle" class="wish-text" font-size="22" font-weight="500" font-style="italic" fill="var(--text-dark)">Happy Birthday</text>
        <text x="200" y="275" text-anchor="middle" class="wish-text name-text" font-size="30" fill="var(--text-dark)">Shorty Sabrina!</text>
      </svg>
    </div>
  </div>
</div>

<button class="surprise-btn" id="surpriseBtn">🎉 Tap for a Surprise! 🎉</button>

<script>
  // Outer space stars
  const starsLayer = document.getElementById('stars');
  for(let i=0; i<35; i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = Math.random()*3+'s';
    starsLayer.appendChild(s);
  }

  // Floating magic inside the card
  const floaters = document.getElementById('floating-elements');
  const symbols = ['❤', '⭐', '✨'];
  for(let i=0; i<18; i++) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = (Math.random() * 90 + 5) + '%'; // keep it somewhat inside
    el.style.animationDuration = (3.5 + Math.random() * 4) + 's';
    el.style.animationDelay = (Math.random() * 3) + 's';
    floaters.appendChild(el);
  }

  /* ---------- confetti + balloons ---------- */
  const fxLayer = document.createElement('div');
  fxLayer.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;';
  document.body.appendChild(fxLayer);

  const confettiColors = ['#f6c667','#ff8fab','#c9a7ff','#8ff0d6','#ffffff','#ff7a3d'];
  function spawnConfetti(count){
    for(let i=0; i<count; i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (Math.random()*100)+'vw';
      p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      const dur = 2.4 + Math.random()*2.2;
      p.style.animationDuration = dur+'s';
      p.style.animationDelay = (Math.random()*0.4)+'s';
      fxLayer.appendChild(p);
      setTimeout(() => p.remove(), (dur+0.6)*1000);
    }
  }

  const balloonColors = ['#ff8fab','#c9a7ff','#8ff0d6','#f6c667','#ff9fc2'];
  function spawnBalloons(count){
    for(let i=0; i<count; i++){
      const b = document.createElement('div');
      b.className = 'balloon-piece';
      b.style.left = (5+Math.random()*85)+'vw';
      b.style.background = balloonColors[i % balloonColors.length];
      const dur = 6 + Math.random()*3;
      b.style.animationDuration = dur+'s';
      b.style.animationDelay = (Math.random()*1.2)+'s';
      fxLayer.appendChild(b);
      setTimeout(() => b.remove(), (dur+1.6)*1000);
    }
  }

  /* ---------- happy birthday tune ---------- */
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  const NOTE = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, Bb4:466.16, C5:523.25 };

  function buildMelody(){
    const e = 0.19, q = 0.38, L = 1.05;
    return [
      [NOTE.C4,e],[NOTE.C4,e],[NOTE.D4,q],[NOTE.C4,q],[NOTE.F4,q],[NOTE.E4,L],
      [NOTE.C4,e],[NOTE.C4,e],[NOTE.D4,q],[NOTE.C4,q],[NOTE.G4,q],[NOTE.F4,L],
      [NOTE.C4,e],[NOTE.C4,e],[NOTE.C5,q],[NOTE.A4,q],[NOTE.F4,q],[NOTE.E4,q],[NOTE.D4,L],
      [NOTE.Bb4,e],[NOTE.Bb4,e],[NOTE.A4,q],[NOTE.F4,q],[NOTE.G4,q],[NOTE.F4,L],
    ];
  }

  function playHappyBirthdayTune(ctx){
    const melody = buildMelody();
    let t = ctx.currentTime + 0.05;
    const master = ctx.createGain();
    master.gain.value = 0.15; // smooth volume
    master.connect(ctx.destination);
    
    melody.forEach(([freq,dur]) => {
      const osc = ctx.createOscillator();
      osc.type = 'triangle'; // softer sound
      osc.frequency.value = freq;
      
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(1, t+0.02);
      g.gain.setValueAtTime(1, t+dur-0.08);
      g.gain.linearRampToValueAtTime(0, t+dur-0.02);
      
      osc.connect(g);
      g.connect(master);
      osc.start(t);
      osc.stop(t+dur);
      t += dur;
    });
    return t - ctx.currentTime;
  }

  /* ---------- surprise button logic ---------- */
  const surpriseBtn = document.getElementById('surpriseBtn');
  const cardInner = document.getElementById('cardInner');
  let confettiIntervalId = null;

  surpriseBtn.addEventListener('click', () => {
    if(surpriseBtn.disabled) return;
    
    const ctx = getAudioCtx();
    const duration = playHappyBirthdayTune(ctx);

    cardInner.classList.add('partying');
    spawnConfetti(60);
    spawnBalloons(10);
    confettiIntervalId = setInterval(() => spawnConfetti(15), 1300);

    surpriseBtn.disabled = true;
    surpriseBtn.textContent = '🎶 Singing...';

    setTimeout(() => {
      cardInner.classList.remove('partying');
      clearInterval(confettiIntervalId);
      spawnConfetti(40);
      surpriseBtn.disabled = false;
      surpriseBtn.textContent = '🎉 Tap for a Surprise again! 🎉';
    }, duration * 1000 + 300);
  });
</script>
