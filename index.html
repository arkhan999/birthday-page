<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Animated Birthday Wish — Sabrina</title>
<style>
  :root{ --bg:#0b1020; --light:#fff3d9; --accent:#ff7aa2; --card:#fef6f8 }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto;display:flex;align-items:center;justify-content:center}
  /* outer responsive container; inner scene scales to fit */
  .stage{width:min(920px,96vw);aspect-ratio:16/9;background:linear-gradient(180deg,#111326 0%, #0b1020 100%);border-radius:12px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(2,6,23,0.8);display:flex;align-items:center;justify-content:center}
  .stage-inner{width:900px;height:540px;position:relative;transform-origin:center center;--s:1;transform:scale(var(--s));}

  /* room floor */
  .floor{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(180deg,#2b2330,#1c1520);box-shadow:inset 0 20px 40px rgba(0,0,0,0.6)}

  /* main character */
  .char{position:absolute;left:-160px;bottom:100px;width:120px;height:160px;display:flex;align-items:flex-end;justify-content:center;transition:transform .5s ease}
  .char .body{width:84px;height:110px;background:linear-gradient(180deg,#ffd9e6,#ffc4dc);border-radius:44px 44px 24px 24px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,0.25)}
  .char .face{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:56px;height:46px;border-radius:18px;background:white;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .eye{width:6px;height:6px;background:#2b1f25;border-radius:50%;margin:0 8px}
  .mouth{width:18px;height:8px;border-radius:8px;background:#2b1f25;margin-top:6px}
  .char.enter{transform:translateX(480px)}

  /* lamp */
  .lamp{position:absolute;left:42%;top:36px;width:82px;height:120px;opacity:0;transform-origin:top center}
  .lamp .bulb{width:50px;height:50px;border-radius:50%;background:#4a3a59;margin:18px auto 0;box-shadow:0 0 0 rgba(255,240,200,0)}
  .lamp.on{opacity:1;box-shadow:0 10px 80px rgba(255,220,140,0.06);}
  .lamp.on .bulb{background:var(--light);box-shadow:0 0 28px 8px rgba(255,230,160,0.18),0 0 80px 18px rgba(255,200,100,0.05)}

  /* table */
  .table{position:absolute;left:50%;transform:translateX(-50%) scale(0.6);bottom:84px;width:420px;height:28px;background:#2f232f;border-radius:8px;opacity:0;transition:all .6s cubic-bezier(.2,.9,.3,1)}
  .table.raised{opacity:1;transform:translateX(-50%) scale(1)}
  .table.legs::before,.table.legs::after{content:'';position:absolute;background:#2f232f;width:18px;height:80px;bottom:-80px}
  .table.legs::before{left:70px}
  .table.legs::after{right:70px}

  /* cake */
  .cake{position:absolute;left:50%;transform:translateX(-50%) scale(0.4);bottom:120px;width:220px;height:120px;border-radius:18px;background:linear-gradient(180deg,#ffecf0,#ffd7e3);box-shadow:0 12px 30px rgba(0,0,0,0.35);opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:all .6s cubic-bezier(.2,.9,.3,1)}
  .cake.show{opacity:1;transform:translateX(-50%) scale(1)}
  .cake .icing{width:100%;height:36px;background:linear-gradient(180deg,#fff8fb,#fff1f6);border-radius:14px 14px 0 0;position:absolute;top:-12px}
  .cake .text{position:relative;color:#7a1020;font-weight:800;font-family: 'Poppins',sans-serif}

  /* candle */
  .candle{position:relative;width:12px;height:44px;background:#fff3d9;border-radius:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,0.06)}
  .flame{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:18px;height:24px;border-radius:50% 50% 40% 40%/60% 60% 40% 40%;background:linear-gradient(180deg,#ffdca6,#ff7a3d);box-shadow:0 6px 20px rgba(255,150,60,0.35);opacity:0;transform-origin:50% 70%;transition:opacity .18s}
  .flame.on{opacity:1;animation:flick 0.9s ease-in-out infinite}
  @keyframes flick{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)} }

  /* smoke (when blow) */
  .smoke{position:absolute;width:12px;height:12px;background:rgba(230,230,240,0.85);border-radius:50%;left:50%;top:-34px;transform:translateX(-50%) scale(0.2);opacity:0}
  .smoke.up{animation:smokeUp 1.2s ease-out forwards}
  @keyframes smokeUp{0%{transform:translateX(-50%) translateY(0) scale(0.2);opacity:0.6}100%{transform:translateX(-50%) translateY(-48px) scale(1.6);opacity:0}}

  /* balloons container */
  .balloon{position:absolute;bottom:140px;left:40%;width:48px;height:66px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ff8fab;transform-origin:center bottom;opacity:0}
  .balloon.pop{animation:risePop 1.2s ease-out forwards}
  @keyframes risePop{0%{transform:translateY(0) scale(1);opacity:1}70%{transform:translateY(-160px) scale(1)}100%{transform:translateY(-220px) scale(0.2);opacity:0}}

  /* confetti pieces */
  .conf{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0.95}

  /* crowd characters */
  .crowd{position:absolute;left:100%;bottom:90px;height:160px;display:flex;gap:18px;align-items:flex-end;padding-right:40px;transition:left .9s cubic-bezier(.2,.9,.3,1)}
  .crowd.show{left:40px}
  .mini{width:72px;height:110px;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
  .bubble{position:absolute;left:50%;transform:translateX(-50%) scale(0.2);bottom:270px;background:#fff;color:#20121a;padding:10px 14px;border-radius:18px;opacity:0;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.15)}
  .bubble.show{opacity:1;transform:translateX(-50%) scale(1)}

  /* control */
  .controls{position:absolute;right:18px;top:18px;}
  .btn{background:linear-gradient(90deg,#ffd27a,#ff8fab);border:none;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}

  /* responsive tweaks */
  @media (max-width:720px){
    .stage{height:78vh}
    .btn{padding:14px 18px;font-size:16px}
  }

  /* respect user preference for reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stage-inner" id="stageInner">
  <div class="lamp" id="lamp">
    <div class="bulb"></div>
  </div>

  <div class="char" id="hero">
    <div class="body">
      <div class="face">
        <div style="display:flex;align-items:center">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <div class="table" id="table"></div>
  <div class="cake" id="cake">
    <div class="icing"></div>
    <div style="position:relative;z-index:3;text-align:center">
      <div class="text" id="cakeText">Happy Birthday Shorty</div>
      <div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px">
        <div class="candle" id="candle">
          <div class="flame" id="flame"></div>
          <div class="smoke" id="smoke"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="balloon" id="ball1" style="left:30%;background:#ff9fc2"></div>
  <div class="balloon" id="ball2" style="left:60%;background:#c9a7ff"></div>

  <div class="floor"></div>

  <div class="crowd" id="crowd">
    <div class="mini" style="background:linear-gradient(180deg,#ffd9e6,#ffc4dc)"></div>
    <div class="mini" style="background:linear-gradient(180deg,#fff0b3,#ffe6a6)"></div>
    <div class="mini" style="background:linear-gradient(180deg,#d0f3ea,#b8f0de)"></div>
    <div class="mini" style="background:linear-gradient(180deg,#c9a7ff,#e6d9ff)"></div>
  </div>

  <div class="bubble" id="bubble">Happy Birthday Sabrina!!!</div>

  <div class="controls"><button class="btn" id="startBtn">Start Surprise</button></div>
  </div>
</div>

<script>
  // small helper
  const wait = ms => new Promise(r=>setTimeout(r,ms));

  const hero = document.getElementById('hero');
  const lamp = document.getElementById('lamp');
  const table = document.getElementById('table');
  const cake = document.getElementById('cake');
  const flame = document.getElementById('flame');
  const smoke = document.getElementById('smoke');
  const ball1 = document.getElementById('ball1');
  const ball2 = document.getElementById('ball2');
  const crowd = document.getElementById('crowd');
  const bubble = document.getElementById('bubble');
  const fxRoot = document.body;
  const startBtn = document.getElementById('startBtn');

  async function runSequence(){
    startBtn.disabled = true;
    // 1) hero enters
    hero.classList.add('enter');
    await wait(900);

    // 2) hero reaches center and turns on lamp (light on)
    lamp.classList.add('on');
    stageGlow(true);
    await wait(800);

    // 3) table appears
    table.classList.add('raised');
    await wait(550);

    // 4) cake pops in
    cake.classList.add('show');
    // show candle flame
    flame.classList.add('on');
    await wait(1200);

    // 5) blow the candle (hero leans and blows)
    // small body lean animation
    hero.style.transform = 'translateX(480px) translateY(-6px) rotate(-3deg)';
    await wait(520);
    // extinguish flame and spawn smoke
    flame.classList.remove('on');
    smoke.classList.add('up');
    spawnConfetti(28);
    await wait(700);

    // 6) balloons burst up
    ball1.classList.add('pop'); ball2.classList.add('pop');
    spawnBalloons(6);
    await wait(700);

    // 7) crowd enters and cheers
    crowd.classList.add('show');
    await wait(1000);
    bubble.classList.add('show');
    spawnConfetti(40);
    await wait(1600);

    // end state: keep crowd and bubble visible
    startBtn.disabled = false;
    startBtn.textContent = 'Play Again';
  }

  // small stage dim/bright effect when lamp on
  function stageGlow(on){
    const stage = document.getElementById('stage');
    if(on) stage.style.background = 'linear-gradient(180deg,#3b2a3f 0%, #1b1220 100%)';
    else stage.style.background = '';
  }

  // confetti
  function spawnConfetti(n){
    for(let i=0;i<n;i++){
      const d = document.createElement('div');
      d.className = 'conf';
      d.style.left = (40 + Math.random()*40) + '%';
      d.style.bottom = (120 + Math.random()*60) + 'px';
      const colors = ['#ffd27a','#ff8fab','#c9a7ff','#8ff0d6','#ffffff','#ff7a3d'];
      d.style.background = colors[Math.floor(Math.random()*colors.length)];
      d.style.transform = `rotate(${Math.random()*360}deg)`;
      document.getElementById('stage').appendChild(d);
      const dur = 1000 + Math.random()*1200;
      d.animate([{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:`translateY(-${300+Math.random()*300}px) rotate(${360+Math.random()*720}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.9,.3,1)'});
      setTimeout(()=>d.remove(), dur+50);
    }
  }

  // balloons rising pieces
  function spawnBalloons(n){
    for(let i=0;i<n;i++){
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = (30 + Math.random()*40) + '%';
      const colors = ['#ff9fc2','#c9a7ff','#8ff0d6','#f6c667'];
      b.style.background = colors[Math.floor(Math.random()*colors.length)];
      document.getElementById('stage').appendChild(b);
      b.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-260px) scale(0.3)',opacity:0}],{duration:900+Math.random()*800,easing:'cubic-bezier(.2,.9,.3,1)'});
      setTimeout(()=>b.remove(),1800);
    }
  }

  // allow replay
  startBtn.addEventListener('click', ()=>{
    // reset scene
    resetScene();
    runSequence();
  });

  function resetScene(){
    hero.classList.remove('enter'); hero.style.transform='';
    lamp.classList.remove('on'); table.classList.remove('raised'); cake.classList.remove('show'); flame.classList.remove('on'); smoke.classList.remove('up');
    ball1.classList.remove('pop'); ball2.classList.remove('pop'); crowd.classList.remove('show'); bubble.classList.remove('show');
    // remove confetti elements if any
    document.querySelectorAll('.conf, .balloon').forEach(n=>{ if(n.parentNode) n.remove(); });
    startBtn.textContent = 'Start Surprise';
  }

  // responsive scaling for the inner scene
  function resizeStage(){
    const outer = document.getElementById('stage');
    const inner = document.getElementById('stageInner');
    if(!outer || !inner) return;
    const ow = outer.clientWidth;
    const oh = outer.clientHeight;
    const scale = Math.min(ow/900, oh/540, 1);
    inner.style.setProperty('--s', scale);
  }
  window.addEventListener('resize', resizeStage);

  // autoplay first time gently (after resizing)
  window.addEventListener('load', ()=>{ resizeStage(); setTimeout(()=> runSequence(), 700); });
</script>

</body>
</html>
