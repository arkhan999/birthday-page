<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark1:#0e0b1e;
    --dark2:#171130;
    --warm1:#3a2a72;
    --warm2:#ff9ecb;
    --gold:#ffd76a;
    --mint:#8ff3d0;
    --lilac:#c9a7ff;
    --cream:#fff6ea;
    --ink:#eae6ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    font-family:'Quicksand', sans-serif;
  }
  .room{
    position:relative;
    width:100%; height:100vh;
    background:
      radial-gradient(ellipse at 50% 110%, var(--dark2), var(--dark1) 70%);
    transition:background 1.4s ease;
    overflow:hidden;
  }
  .room.lit{
    background:
      radial-gradient(ellipse at 30% 100%, #ff9ecb22, transparent 60%),
      radial-gradient(ellipse at 70% 10%, #ffd76a33, transparent 55%),
      radial-gradient(ellipse at 50% 110%, var(--warm1), #241b4e 75%);
  }

  /* stars, visible only in dark phase */
  .star{
    position:absolute; width:2px; height:2px; background:var(--cream);
    border-radius:50%; opacity:.6; animation:twinkle 3s ease-in-out infinite;
    transition:opacity .8s ease;
  }
  .room.lit .star{ opacity:0; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.8;} }

  /* bulb + switch */
  .bulb-wrap{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center;
    z-index:3;
  }
  .cord{ width:2px; height:70px; background:#544a7a; }
  .bulb{
    width:26px; height:34px;
    border-radius:50% 50% 45% 45%;
    background:#544a7a;
    position:relative;
    transition:background .3s ease, box-shadow .3s ease;
  }
  .bulb::after{
    content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    width:14px; height:8px; background:#3d365c; border-radius:2px;
  }
  .room.lit .bulb{
    background:radial-gradient(circle at 45% 35%, #fffbe0, var(--gold) 60%, #ffb84d 100%);
    box-shadow:0 0 40px 18px rgba(255,215,106,.55), 0 0 90px 40px rgba(255,215,106,.25);
  }
  .glow-wash{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,215,106,.35), transparent 65%);
    opacity:0; transition:opacity 1s ease; pointer-events:none; z-index:2;
  }
  .room.lit .glow-wash{ opacity:1; }

  .switch-plate{
    position:absolute; bottom:44%; left:23%;
    width:20px; height:32px; background:#403862; border-radius:4px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    z-index:3;
  }
  .switch-toggle{
    position:absolute; left:3px; top:4px; width:14px; height:12px;
    background:#c9c2e8; border-radius:2px;
    transition:top .25s ease, background .25s ease;
  }
  .room.lit .switch-toggle{ top:16px; background:var(--gold); }

  /* decor, hidden until lit */
  .decor{ opacity:0; transition:opacity 1s ease .3s; }
  .room.lit .decor{ opacity:1; }

  .banner{
    position:absolute; top:6%; left:50%; transform:translateX(-50%);
    font-family:'Fredoka', sans-serif; font-weight:700;
    font-size:clamp(22px,4vw,40px);
    color:var(--cream);
    text-shadow:0 0 18px rgba(255,215,106,.4);
    display:flex; gap:2px; z-index:3;
    white-space:nowrap;
  }
  .banner span{
    display:inline-block;
    animation:bob 2.2s ease-in-out infinite;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .streamer{
    position:absolute; top:-20px; width:6px; height:60px; border-radius:3px;
    animation:streamerSway 3s ease-in-out infinite;
    transform-origin:top center;
  }
  @keyframes streamerSway{
    0%,100%{ transform:rotate(-8deg); }
    50%{ transform:rotate(8deg); }
  }

  .balloon-layer{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .balloon{
    position:absolute; bottom:-160px; width:46px; height:58px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    animation-name:rise, swayB; animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));
  }
  .balloon::after{
    content:''; position:absolute; left:50%; top:100%; width:1px; height:50px;
    background:rgba(255,246,234,.35); transform:translateX(-50%);
  }
  @keyframes rise{ to{ transform:translateY(-140vh); } }
  @keyframes swayB{ 0%,100%{ margin-left:0; } 50%{ margin-left:22px; } }

  /* ---- stick figure ---- */
  .figure{
    position:absolute; bottom:8%; left:-15%;
    width:50px; height:110px;
    z-index:5;
    transition:left 7s linear;
    transform:scale(var(--figScale, 1));
    transform-origin:bottom center;
  }
  .fpart{ position:absolute; background:var(--cream); border-radius:3px; }
  .head{
    width:22px; height:22px; border-radius:50%;
    top:0; left:14px;
    background:var(--cream);
  }
  .hair{
    position:absolute; top:-9px; left:16px; width:20px; height:12px;
    z-index:2;
  }
  .hair::before, .hair::after{
    content:''; position:absolute; bottom:0;
    border-left:5px solid transparent; border-right:5px solid transparent;
    border-bottom:12px solid #3d2b1f;
  }
  .hair::before{ left:0; transform:rotate(-14deg); }
  .hair::after{ left:8px; transform:rotate(10deg); }
  .torso{ width:4px; height:34px; top:22px; left:23px; }
  .arm-l, .arm-r{
    width:4px; height:26px; top:26px; left:23px;
    transform-origin:top center; transition:transform .3s ease;
  }
  .arm-l{ transform:rotate(-22deg); }
  .arm-r{ transform:rotate(22deg); }
  .leg-l, .leg-r{
    width:4px; height:32px; top:56px; left:23px;
    transform-origin:top center; transition:transform .3s ease;
  }
  .leg-l{ transform:rotate(-14deg); }
  .leg-r{ transform:rotate(14deg); }

  .figure.walking .leg-l{ animation:legL 1.1s ease-in-out infinite; transition:none; }
  .figure.walking .leg-r{ animation:legR 1.1s ease-in-out infinite; transition:none; }
  .figure.walking .arm-l{ animation:legR 1.1s ease-in-out infinite; transition:none; }
  .figure.walking .arm-r{ animation:legL 1.1s ease-in-out infinite; transition:none; }
  @keyframes legL{ 0%,100%{ transform:rotate(-22deg); } 50%{ transform:rotate(22deg); } }
  @keyframes legR{ 0%,100%{ transform:rotate(22deg); } 50%{ transform:rotate(-22deg); } }

  .figure.reaching .arm-r{ transform:rotate(-150deg); }

  .figure.cheer .arm-l{ animation:cheerL .6s ease-in-out infinite; }
  .figure.cheer .arm-r{ animation:cheerR .6s ease-in-out infinite; }
  @keyframes cheerL{ 0%,100%{ transform:rotate(-145deg); } 50%{ transform:rotate(-110deg); } }
  @keyframes cheerR{ 0%,100%{ transform:rotate(145deg); } 50%{ transform:rotate(110deg); } }

  /* table that pops in */
  .table-wrap{
    position:absolute; bottom:8%; left:58%;
    transform:translateX(-50%) scale(.6) translateY(20px);
    opacity:0;
    transition:opacity .6s ease, transform .6s cubic-bezier(.34,1.56,.64,1);
    z-index:4;
  }
  .table-wrap.show{
    opacity:1; transform:translateX(-50%) scale(1) translateY(0);
  }
  .table-top{
    width:150px; height:14px; border-radius:4px;
    background:linear-gradient(180deg, #d8ac77, #8a5f36);
    box-shadow:0 6px 10px rgba(0,0,0,.35);
  }
  .table-leg{
    position:absolute; width:9px; height:52px;
    background:linear-gradient(180deg, #7a5330, #5a3c22);
    top:14px;
  }
  .table-leg.l{ left:14px; }
  .table-leg.r{ right:14px; }

  /* cake on the table */
  .cake{
    position:absolute; bottom:14px; left:50%;
    width:56px; height:44px;
    transform:translateX(-50%) scale(1,1);
    transform-origin:bottom center;
    transition:transform 1.1s cubic-bezier(.45,.05,.25,1);
  }
  .cake.zoomed{
    transform:translateX(-50%) scale(1.35, 2.6);
  }
  .cake-top{
    position:absolute; bottom:16px; left:6px; width:44px; height:18px;
    border-radius:6px;
    background:linear-gradient(180deg, #ff9ecb, #ff6fa8);
  }
  .cake-base{
    position:absolute; bottom:0; left:0; width:56px; height:18px;
    border-radius:6px;
    background:linear-gradient(180deg, #ffd76a, #ffb84d);
  }
  .cake-candle{
    position:absolute; bottom:34px; left:26px; width:3px; height:13px;
    background:var(--mint);
  }
  .cake-flame{
    position:absolute; bottom:47px; left:24px; width:7px; height:9px;
    border-radius:50%; background:var(--gold);
    box-shadow:0 0 10px 3px rgba(255,215,106,.85);
    animation:flicker 1s ease-in-out infinite;
    transition:opacity .3s ease;
  }
  .cake-flame.out{ opacity:0; animation:none; }
  .cake-smoke{
    position:absolute; bottom:47px; left:24px; width:8px; height:8px;
    border-radius:50%; background:rgba(255,255,255,.55);
    opacity:0; pointer-events:none;
  }
  .cake-smoke.go{ animation:smokeUp 1.3s ease-out forwards; }
  @keyframes smokeUp{
    0%{ opacity:.7; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(6px,-46px) scale(2.8); }
  }
  @keyframes flicker{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.25) translateY(-1px); } }
  .cake-text{
    position:absolute; bottom:18px; left:9px; width:38px;
    font-size:6.4px; line-height:1.15; letter-spacing:.2px;
    font-family:'Fredoka', sans-serif; font-weight:700;
    color:#fff6ea; text-align:center;
    text-shadow:0 0 2px rgba(255,111,168,.9);
    transform:rotate(-2deg);
  }
  .sparkle{
    position:fixed; width:5px; height:5px; z-index:21; pointer-events:none;
    background:var(--gold); border-radius:50%;
    box-shadow:0 0 6px 2px rgba(255,215,106,.8);
    animation:sparkleUp 1.4s ease-out forwards;
  }
  @keyframes sparkleUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-60px) scale(.3); }
  }

  /* Fuuu blow button */
  .fuuu-btn{
    position:fixed; left:50%; bottom:9%;
    transform:translateX(-50%) scale(.6);
    opacity:0; pointer-events:none;
    z-index:25;
    font-family:'Fredoka', sans-serif; font-weight:700;
    font-size:clamp(16px,2.6vw,22px);
    padding:12px 32px; border-radius:999px;
    background:var(--gold); color:var(--dark1);
    border:none; cursor:pointer;
    box-shadow:0 8px 20px rgba(255,215,106,.5);
    transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .fuuu-btn.show{
    opacity:1; pointer-events:auto;
    transform:translateX(-50%) scale(1);
    animation:btnPulse 1.2s ease-in-out infinite;
  }
  @keyframes btnPulse{
    0%,100%{ box-shadow:0 8px 20px rgba(255,215,106,.5); }
    50%{ box-shadow:0 8px 30px rgba(255,215,106,.9); }
  }

  /* speech bubble */
  .bubble{
    position:absolute; bottom:78%; left:20%;
    background:var(--cream); color:var(--dark1);
    font-family:'Fredoka', sans-serif; font-weight:600;
    font-size:clamp(13px,1.8vw,17px);
    padding:14px 18px; border-radius:16px;
    max-width:min(60vw, 320px);
    box-shadow:0 10px 24px rgba(0,0,0,.35);
    opacity:0; transform:scale(.6) translateY(10px);
    transform-origin:bottom left;
    z-index:6;
    line-height:1.35;
    white-space:pre-line;
  }
  .bubble::after{
    content:''; position:absolute; bottom:-10px; left:22px;
    border-width:10px 10px 0 0; border-style:solid;
    border-color:var(--cream) transparent transparent transparent;
  }
  .bubble.show{
    animation:bubblePop .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes bubblePop{ to{ opacity:1; transform:scale(1) translateY(0); } }
  .cursor{ display:inline-block; width:2px; background:var(--dark1); margin-left:1px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .spotlight{
    position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(circle at var(--sx,46%) var(--sy,62%), transparent 8%, rgba(10,8,20,.7) 42%);
    opacity:0; transition:opacity .7s ease;
  }
  .spotlight.show{ opacity:1; }

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:20; }
  .confetti{ position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:.9; } }

  @media (prefers-reduced-motion: reduce){
    .balloon,.star,.banner span,.streamer,.figure.walking .leg-l,.figure.walking .leg-r,
    .figure.walking .arm-l,.figure.walking .arm-r,.figure.cheer .arm-l,.figure.cheer .arm-r,
    .cake-flame,.fuuu-btn.show{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="room" id="room">
  <div class="glow-wash"></div>
  <div class="bulb-wrap">
    <div class="cord"></div>
    <div class="bulb"></div>
  </div>
  <div class="switch-plate"><div class="switch-toggle"></div></div>

  <div class="banner decor" id="banner"></div>
  <div class="balloon-layer decor" id="balloonLayer"></div>
  <div id="streamerLayer"></div>

  <div class="figure" id="figure">
    <div class="hair"></div>
    <div class="fpart head"></div>
    <div class="fpart torso"></div>
    <div class="fpart arm-l"></div>
    <div class="fpart arm-r"></div>
    <div class="fpart leg-l"></div>
    <div class="fpart leg-r"></div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="cake" id="cake">
      <div class="cake-candle"></div>
      <div class="cake-flame" id="flame"></div>
      <div class="cake-smoke" id="smoke"></div>
      <div class="cake-base"></div>
      <div class="cake-top"></div>
      <div class="cake-text">Happy<br>Birthday</div>
    </div>
    <div class="table-top"></div>
    <div class="table-leg l"></div>
    <div class="table-leg r"></div>
  </div>

  <div class="bubble" id="bubble"></div>
</div>

<div class="spotlight" id="spotlight"></div>
<button class="fuuu-btn" id="fuuuBtn">Fuuu 💨</button>
<div class="confetti-layer" id="confettiLayer"></div>

<script>
  const room = document.getElementById('room');
  const figure = document.getElementById('figure');
  const bubble = document.getElementById('bubble');
  const banner = document.getElementById('banner');
  const balloonLayer = document.getElementById('balloonLayer');
  const streamerLayer = document.getElementById('streamerLayer');
  const confettiLayer = document.getElementById('confettiLayer');

  // stars
  for(let i=0;i<50;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*50+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    room.appendChild(s);
  }

  // banner text
  "HAPPY BIRTHDAY".split('').forEach((ch,i)=>{
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i*0.06)+'s';
    banner.appendChild(span);
  });

  // streamers
  const streamerColors = ['#ff9ecb','#ffd76a','#8ff3d0','#c9a7ff'];
  for(let i=0;i<10;i++){
    const st = document.createElement('div');
    st.className='streamer decor';
    st.style.left = (5+i*10)+'%';
    st.style.background = streamerColors[i % streamerColors.length];
    st.style.animationDelay = (Math.random()*2)+'s';
    streamerLayer.appendChild(st);
  }

  // balloons
  const balloonColors = ['#ff9ecb','#ffc98b','#8ff3d0','#c9a7ff','#ff7ab3','#ffe08a'];
  for(let i=0;i<7;i++){
    const b = document.createElement('div');
    b.className='balloon';
    b.style.background = balloonColors[i % balloonColors.length];
    b.style.left = (6 + i*13 + Math.random()*6)+'%';
    const dur = 18 + Math.random()*10;
    b.style.animationDuration = dur+'s, '+(4+Math.random()*2.5)+'s';
    b.style.animationDelay = (-Math.random()*dur)+'s, 0s';
    balloonLayer.appendChild(b);
  }

  function burstConfetti(){
    const confettiColors = ['#ff9ecb','#ffc98b','#8ff3d0','#c9a7ff','#ffd76a','#fff6ea'];
    for(let i=0;i<100;i++){
      const c = document.createElement('div');
      c.className='confetti';
      const size = 6+Math.random()*6;
      c.style.width = size+'px';
      c.style.height = (size*0.4)+'px';
      c.style.left = Math.random()*100+'%';
      c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      const dur = 2.6 + Math.random()*2.2;
      c.style.animationDuration = dur+'s';
      c.style.animationDelay = (Math.random()*0.6)+'s';
      confettiLayer.appendChild(c);
      setTimeout(()=>c.remove(), (dur+1)*1000);
    }
  }

  function sparkleBurst(el, count){
    const r = el.getBoundingClientRect();
    for(let i=0;i<count;i++){
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      const x = r.left + Math.random()*r.width;
      const y = r.top + Math.random()*r.height;
      sp.style.left = x+'px';
      sp.style.top = y+'px';
      sp.style.animationDelay = (Math.random()*0.4)+'s';
      document.body.appendChild(sp);
      setTimeout(()=>sp.remove(), 2000);
    }
  }

  function waitForClick(el){
    return new Promise(resolve=>{
      function handler(){
        el.removeEventListener('click', handler);
        resolve();
      }
      el.addEventListener('click', handler);
    });
  }

  function typewriter(el, text, speed){
    return new Promise(resolve=>{
      el.textContent = '';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      el.appendChild(cursor);
      let i = 0;
      const timer = setInterval(()=>{
        cursor.insertAdjacentText('beforebegin', text[i]);
        i++;
        if(i >= text.length){
          clearInterval(timer);
          cursor.remove();
          resolve();
        }
      }, speed);
    });
  }

  const spotlight = document.getElementById('spotlight');
  const tableWrap = document.getElementById('tableWrap');
  const cake = document.getElementById('cake');
  const flame = document.getElementById('flame');
  const smoke = document.getElementById('smoke');
  const fuuuBtn = document.getElementById('fuuuBtn');

  // responsive stick-figure size based on viewport width
  function updateFigScale(){
    const w = window.innerWidth;
    const scale = Math.min(1.5, Math.max(0.65, w / 900));
    document.documentElement.style.setProperty('--figScale', scale.toFixed(3));
  }
  updateFigScale();
  window.addEventListener('resize', updateFigScale);

  function aimSpotlightAt(el){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    spotlight.style.setProperty('--sx', (cx / window.innerWidth * 100)+'%');
    spotlight.style.setProperty('--sy', (cy / window.innerHeight * 100)+'%');
  }

  async function runScene(){
    // 1. slow-motion walk toward the switch
    figure.classList.add('walking');
    figure.style.left = '20%';
    await wait(7000);

    // 2. reach and flip switch
    figure.classList.remove('walking');
    figure.classList.add('reaching');
    await wait(500);
    room.classList.add('lit');
    await wait(900);
    figure.classList.remove('reaching');

    // 3. walk a little closer to stand beside where the table will appear
    await wait(300);
    figure.classList.add('walking');
    figure.style.left = '34%';
    await wait(3200);
    figure.classList.remove('walking');

    // 4. a table pops in with the lit cake on it
    await wait(300);
    tableWrap.classList.add('show');
    await wait(700);

    // 5. zoom in on the cake, vertically, and reveal the blow button
    aimSpotlightAt(cake);
    spotlight.classList.add('show');
    cake.classList.add('zoomed');
    await wait(1200);
    fuuuBtn.classList.add('show');

    // 6. wait for the tap, then blow the candle out
    await waitForClick(fuuuBtn);
    fuuuBtn.classList.remove('show');
    flame.classList.add('out');
    smoke.classList.add('go');
    await wait(900);

    // 7. zoom back out
    cake.classList.remove('zoomed');
    spotlight.classList.remove('show');
    await wait(1100);

    // 8. cheer and speak
    figure.classList.add('cheer');
    sparkleBurst(cake, 18);
    await wait(200);
    bubble.classList.add('show');
    await wait(300);
    await typewriter(bubble, "Happy Birthday! 🎉", 38);
    await wait(500);
    burstConfetti();
    sparkleBurst(cake, 14);
    await typewriter(bubble, "Happy Birthday! 🎉\nBe happy, and always stay happy. 💛", 32);
  }

  function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

  window.addEventListener('load', ()=> setTimeout(runScene, 400));
</script>
</body>
</html>
